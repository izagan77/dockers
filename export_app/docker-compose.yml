services:
# --- Custom Python Application Service ---
  # Wire your pre-existing Python container into the stack
  my-python-app:
    image: python:3.11-slim
    container_name: export-app3-runner
    volumes:
      - .:/app
    working_dir: /app
    networks:
      - central-db-network
    external_links:
      - local-postgres:local-postgres
    #command: python export.py
    command: sh -c "pip install --no-cache-dir -r requirements.txt && python export.py"
    # CRUCIAL ADDITION: The tail command keeps the container awake indefinitely
    #command: sh -c "pip install --no-cache-dir -r requirements.txt && python export.py && tail -f /dev/null"

networks:
  central-db-network:
    external: true  # Links this file to the shared database network bridge