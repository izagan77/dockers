services:
# --- Custom Python Application Service ---
  # Wire your pre-existing Python container into the stack
  my-python-app:
    image: my-python-app:latest # Uses your pre-existing image
    container_name: my-python-app
    volumes:
      - .:/app # Mounts the export_app folder to the container's app path
    working_dir: /app
    #command: tail -f /dev/null # Keeps the container awake so you can execute scripts inside
    command: sh -c "pip install --no-cache-dir -r requirements.txt && tail -f /dev/null" it
    networks:
      - central-db-network  # Joins the same external network lane
      # Inside your python connection code, set host='local-postgres'
    # CRUCIAL CHANGE: Installs packages first, then runs your long-lived idle process

networks:
  central-db-network:
    external: true  # Links this file to the shared database network bridge